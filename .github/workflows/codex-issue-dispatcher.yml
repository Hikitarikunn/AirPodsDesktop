name: Codex Issue Dispatcher

on:
  issue_comment:
    types: [created]

concurrency:
  group: codex-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  run-codex:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == '/codex run'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      BRANCH_NAME: codex/issue-${{ github.event.issue.number }}-${{ github.run_id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Create work branch
        shell: bash
        run: git switch -c "$BRANCH_NAME"

      - name: Build Codex task prompt
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          issue = event["issue"]

          prompt = f"""You are the implementation executor for GitHub Issue #{issue["number"]}.

Read AGENTS.md first and follow it as repository policy.

Implement only the task described below. Keep the change minimal and within scope.
Do not commit, push, create a pull request, merge, or modify GitHub metadata; the workflow handles that after you finish.
Run the most relevant feasible verification. If a requested verification cannot run in this environment, say exactly why in your final report.

Issue title:
{issue["title"]}

Issue body:
{issue.get("body") or "(no body)"}

Your final response must include:
1. implementation summary;
2. files changed;
3. verification actually performed and results;
4. anything not verified;
5. risks or follow-up concerns.
"""
          Path(".codex-task.md").write_text(prompt, encoding="utf-8")
          PY

      - name: Run Codex
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          allow-users: ${{ github.repository_owner }}
          prompt-file: .codex-task.md
          output-file: .codex-final.md

      - name: Prepare GitHub write access
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git

      - name: Publish result
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .codex-task.md

          if git diff --quiet && git diff --cached --quiet; then
            {
              echo "Codex completed Issue #$ISSUE_NUMBER but produced no repository changes."
              echo
              echo "### Codex report"
              cat .codex-final.md
            } > "$RUNNER_TEMP/issue-comment.md"

            gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/issue-comment.md"
            rm -f .codex-final.md
            exit 0
          fi

          {
            echo "Closes #$ISSUE_NUMBER"
            echo
            echo "## Codex execution report"
            cat .codex-final.md
            echo
            echo "## Planner review"
            echo
            echo "This PR was generated by the repository Codex issue dispatcher and requires planner review before merge."
          } > "$RUNNER_TEMP/pr-body.md"

          rm -f .codex-final.md
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "codex: implement issue #$ISSUE_NUMBER"
          git push --set-upstream origin "$BRANCH_NAME"

          ISSUE_TITLE="$(jq -r '.issue.title' "$GITHUB_EVENT_PATH")"
          PR_URL="$(gh pr create             --base main             --head "$BRANCH_NAME"             --title "Codex: $ISSUE_TITLE"             --body-file "$RUNNER_TEMP/pr-body.md")"

          gh issue comment "$ISSUE_NUMBER" --body "Codex implementation PR created: $PR_URL"

      - name: Report dispatcher failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$ISSUE_NUMBER"             --body "Codex dispatcher failed. Review the GitHub Actions run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
